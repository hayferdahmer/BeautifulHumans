name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test harness
        run: npm install --prefix tools --no-audit --no-fund

      - name: Unit tests
        run: node tools/run_tests.mjs

      - name: Build release
        run: node tools/build.mjs

      - name: Validate release
        run: node tools/validate.mjs

      - name: Upload BeautifulHumansCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeautifulHumansCore-0.1.0
          path: releases/BeautifulHumansCore
          if-no-files-found: error
          retention-days: 30

      - name: Upload BHTestMod artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHTestMod-0.1.0
          path: releases/BHTestMod
          if-no-files-found: error
          retention-days: 30
